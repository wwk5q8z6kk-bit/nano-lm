[pytest]
# Nanoscribe suite — run via scripts/ci_nanoscribe.sh or:
#   python3 -m pytest -c pytest.nanoscribe.ini nanoscribe -q
testpaths =
    nanoscribe
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .venv
    .cursor
    .autonomous
    .pytest_cache
    checkpoints
    artifacts
addopts = -q
