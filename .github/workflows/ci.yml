name: ci

on:
  push:
    branches: [master, 'docs/**']
  pull_request:

jobs:
  canonical-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ACTIVE_NOW consistency
        run: python3 scripts/check_active_now.py

      - name: Documentation integrity
        run: python3 scripts/check_docs_integrity.py

      - name: Fabric regression pins
        run: python3 fabric/test_fabric.py

      - name: C3 recompute regression pins
        run: python3 trajectory/test_recompute_c3.py

      - name: Encounter Representation v0
        run: python3 nanoscribe/test_encounter_v0.py

      - name: Model adapter baseline smoke
        run: python3 nanoscribe/benchmark.py

  # The canonical-integrity job above invokes a handful of test files by name.
  # That enumeration silently excluded 15 of 19 nanoscribe test files, including
  # the native tokenizer round-trip pin and the corrupt-checkpoint pin — the two
  # regression guards for defects that invalidated a full round of native
  # results. Run the suite instead of a hand-maintained list.
  nanoscribe-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        # CPU torch wheel: two nanoscribe test files build native models, and
        # skipping them would leave the tokenizer/checkpoint pins unexercised.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt httpx
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: nanoscribe suite
        run: python3 -m pytest nanoscribe scripts/test_classify_owner_speech_act.py -q -p no:cacheprovider
