name: ci

on:
  push:
    branches: [master, docs/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/check_active_now.py
      - run: python scripts/check_docs_integrity.py
      - run: pytest fabric/test_fabric.py trajectory/test_recompute_c3.py -q
