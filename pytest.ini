[pytest]
# Default local suite: pure unit/recompute tests only.
# Kaggle/RunPod training scripts (e.g. scale/kaggle_scale_test.py) are NOT tests;
# they assert CUDA at import time and must not break collection on CPU laptops.
testpaths =
    fabric
    trajectory
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .venv
    .cursor
    .autonomous
    .pytest_cache
    checkpoints
    artifacts
    audit
    papers
    scale
    pretrain
    scribe
    sft
    stage_m
    trajectory/e1
    trajectory/e2
    trajectory/e3
    trajectory/runpod_partial
    trajectory/replications
addopts = -q
