[project]
name = "nano-lm"
version = "0.1.0"
description = "Measurement research: held-out value copying in small LMs + Fabric verification slice"
readme = "README.md"
requires-python = ">=3.10"
# Runtime pins live in requirements.txt (torch stack is environment-specific).

# NOTE: pytest configuration lives in pytest.ini, which takes precedence over
# this file. A [tool.pytest.ini_options] block here is silently ignored ("WARNING:
# ignoring pytest config in pyproject.toml"), so editing testpaths here has no
# effect and is a trap for the next reader. Change pytest.ini instead.

[tool.setuptools]
py-modules = []
