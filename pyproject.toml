[project]
name = "nano-lm"
version = "0.1.0"
description = "Measurement research: held-out value copying in small LMs + Fabric verification slice"
readme = "README.md"
requires-python = ">=3.10"
# Runtime pins live in requirements.txt (torch stack is environment-specific).

[tool.pytest.ini_options]
testpaths = ["fabric", "trajectory"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = []
